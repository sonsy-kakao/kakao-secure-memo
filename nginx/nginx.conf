worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                       # 버전 정보 노출 차단
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 64k;
    client_body_buffer_size 16k;

    # 비root 실행을 위한 임시 경로
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # 무차별 대입 / Nonce 남발 방지
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    # Docker 내장 DNS를 주기적으로 재조회 → 배포로 WAS 컨테이너 IP가 바뀌어도 자동 추종
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 8080;                         # 컨테이너 내부 8080 ← 호스트 80 매핑
        server_name _;

        set $was http://app:8000;

        # WAS도 같은 헤더를 보내므로 중복 제거 후 Nginx 값만 사용
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_set_header Host              $http_host;   # 포트 포함 (Origin 검증과 일치)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
        # 배포 중 한 컨테이너가 내려가는 순간 다른 컨테이너로 재시도
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location = /healthz      { return 404; }      # WAS 헬스체크는 외부 비공개

        location = /api/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass $was;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass $was;
        }

        location / {
            proxy_pass $was;
        }
    }
}
